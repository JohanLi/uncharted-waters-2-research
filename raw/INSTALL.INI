SET	DOS		5.0
SET	EMS		32
SET	DISKNUM		1
SET	DISK01VOL	NH_CD
REM	SET	DISK02VOL	DISK-02
REM	SET	DISK03VOL	DISK-03
REM	SET	DISK04VOL	DISK-04
REM	SET	DISK05VOL	DISK-05
REM	SET	DISK06VOL	DISK-06
REM	SET	DISK07VOL	DISK-07
REM	SET	DISK08VOL	DISK-08
REM	SET	DISK09VOL	DISK-09
REM	SET 	DISK10VOL	DISK-10

ECHO	GAMETITLE
"New Horizons"

ECHO	WELCOME
"         Welcome to the world of Koei Games!

Before installing 'New Horizons', please make sure that
your computer has the following:
1) at least 440 KBytes free conventional memory
2) at least 512 KBytes free EMS memory
3) at least 5 MBytes of free space on the hard disk

Press ENTER to continue the installation. To stop the
installation, press the ESC key now."

ECHO	BYE
"Before playing 'New Horizons', we strongly suggest that you
check your memory for bytes free with either the MEM or CHKDSK
MS-DOS commands. You must have at least 440 KBytes free for
this game to run properly.

If you find that you have less than the required amount of
bytes free, please refer to the Reference Card that came
with the package for assistance in making a Boot Disk or
changing your AUTOEXEC.BAT and CONFIG.SYS files.

To start the game, type KOEI from the directory where the
game was installed.

To enjoy the orchestrated version of the 'New Horizons' opening music,
leave the New Horizons CD in the CD-ROM drive before starting the game.

Thank you and have fun!!"
QUIT

