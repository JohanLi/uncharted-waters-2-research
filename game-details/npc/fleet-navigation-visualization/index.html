  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;style&gt;
#uw2-navigation-explorer{color:var(--foreground);background:transparent;padding:0;display:grid;gap:10px}
#uw2-navigation-explorer .controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end}
#uw2-navigation-explorer label{display:grid;gap:4px;color:var(--foreground);min-width:150px}
#uw2-navigation-explorer .port{flex:1 1 180px}#uw2-navigation-explorer .step{flex:2 1 260px}
#uw2-navigation-explorer .check{display:flex;align-items:center;gap:6px;min-width:auto;padding-bottom:5px}
#uw2-navigation-explorer select,#uw2-navigation-explorer input[type=range]{width:100%}
#uw2-navigation-explorer .status{color:var(--foreground);min-height:1.5em}
#uw2-navigation-explorer .map-wrap{position:relative;aspect-ratio:2/1;min-height:180px;overflow:hidden;border:1px solid var(--border);background:var(--muted)}
#uw2-navigation-explorer svg{display:block;width:100%;height:100%}
#uw2-navigation-explorer .edge{stroke:var(--foreground);stroke-width:3;opacity:.6}
#uw2-navigation-explorer .node{fill:var(--foreground);stroke:var(--background);stroke-width:2;opacity:.9}
#uw2-navigation-explorer .route-base{fill:none;stroke:var(--viz-series-2);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;opacity:.72}
#uw2-navigation-explorer .route-done{fill:none;stroke:var(--viz-series-1);stroke-width:13;stroke-linecap:round;stroke-linejoin:round}
#uw2-navigation-explorer .cache-node{fill:var(--background);stroke:var(--viz-series-3);stroke-width:8}
#uw2-navigation-explorer .endpoint{fill:var(--background);stroke:var(--foreground);stroke-width:8}
#uw2-navigation-explorer .ship{fill:var(--viz-series-1);stroke:var(--background);stroke-width:7}
#uw2-navigation-explorer .map-label{fill:var(--foreground);stroke:var(--background);stroke-width:7;paint-order:stroke;font-weight:500}
#uw2-navigation-explorer .legend{display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--muted-foreground)}
#uw2-navigation-explorer .key{display:inline-flex;align-items:center;gap:6px}
#uw2-navigation-explorer .dot{width:10px;height:10px;border-radius:50%;background:var(--viz-series-1)}
#uw2-navigation-explorer .dot.cache{background:var(--background);border:2px solid var(--viz-series-3)}
#uw2-navigation-explorer .line{width:18px;border-top:3px solid var(--viz-series-2)}
@media(max-width:480px){#uw2-navigation-explorer .map-wrap{min-height:150px}}
